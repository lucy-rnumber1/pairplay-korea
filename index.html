<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pairplay · Korea travel, made easy</title>
<meta name="description" content="Travel services that make Korea easier for visitors. Pre-launch early access.">
<style>
  :root{
    --accent:#2f6fed; --accent-soft:#e8efff;
    --bg:#f7f6f2; --card:#ffffff; --ink:#17191e; --muted:#5f6571; --line:#e6e3dc;
    --radius:18px;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans","PingFang TC","Microsoft JhengHei","Hiragino Sans","Yu Gothic",sans-serif;
    line-height:1.5; -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:560px;margin:0 auto;padding:0 16px}
  header{display:flex;align-items:center;justify-content:space-between;padding:14px 0}
  .brand{font-weight:800;letter-spacing:-.02em;font-size:18px;cursor:pointer}
  .brand span{color:var(--accent)}
  .langs{display:flex;gap:4px}
  .langs button{border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:999px;padding:5px 10px;font-size:13px;cursor:pointer}
  .langs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}

  .badge{display:inline-block;background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:12px;padding:5px 10px;border-radius:999px;margin-top:8px}
  .hero{padding:18px 0 8px}
  .emoji{width:76px;height:76px;border-radius:22px;background:var(--accent-soft);display:grid;place-items:center;font-size:40px;margin-bottom:14px}
  h1{font-size:30px;line-height:1.2;letter-spacing:-.02em;margin:10px 0 10px}
  .tag{color:var(--muted);font-size:17px;margin:0 0 18px}
  .price{display:flex;align-items:baseline;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;margin-bottom:14px}
  .price small{color:var(--muted);font-size:13px}
  .price b{font-size:20px}
  .cta{display:block;width:100%;border:0;border-radius:14px;background:var(--accent);color:#fff;font-weight:800;font-size:17px;padding:16px;cursor:pointer;box-shadow:0 6px 18px -8px var(--accent)}
  .cta:active{transform:translateY(1px)}
  section{margin:28px 0}
  h2{font-size:15px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0 0 12px}
  .list{list-style:none;padding:0;margin:0;display:grid;gap:10px}
  .list li{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 14px 14px 44px;position:relative}
  .list li::before{content:"✓";position:absolute;left:14px;top:13px;width:20px;height:20px;border-radius:50%;background:var(--accent);color:#fff;font-size:12px;display:grid;place-items:center;font-weight:800}
  .steps{counter-reset:s;list-style:none;padding:0;margin:0;display:grid;gap:10px}
  .steps li{counter-increment:s;display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
  .steps li::before{content:counter(s);flex:0 0 30px;height:30px;border-radius:10px;background:var(--accent-soft);color:var(--accent);font-weight:800;display:grid;place-items:center}
  footer{color:var(--muted);font-size:12px;padding:24px 0 110px;border-top:1px solid var(--line);margin-top:32px}
  .sticky{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(to top,var(--bg) 70%,transparent);z-index:5}
  .sticky .cta{max-width:528px;margin:0 auto}

  /* hub */
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;cursor:pointer;text-align:left;font:inherit;color:inherit;display:flex;flex-direction:column;gap:8px;min-height:120px}
  .card:hover{border-color:var(--ink)}
  .card .e{font-size:28px}
  .card b{font-size:14px;line-height:1.3}

  /* sheet */
  .shade{position:fixed;inset:0;background:rgba(15,17,22,.45);display:none;z-index:10}
  .sheet{position:fixed;left:0;right:0;bottom:0;max-height:92vh;overflow:auto;background:var(--card);border-radius:22px 22px 0 0;padding:22px 16px calc(22px + env(safe-area-inset-bottom));display:none;z-index:11}
  .sheet .in{max-width:528px;margin:0 auto}
  .sheet h3{font-size:22px;margin:0 0 6px;letter-spacing:-.01em}
  .sheet p{color:var(--muted);margin:0 0 16px}
  .x{position:absolute;right:14px;top:12px;border:0;background:var(--bg);border-radius:50%;width:34px;height:34px;font-size:18px;cursor:pointer}
  label{display:block;font-weight:700;font-size:14px;margin:14px 0 6px}
  input,select{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px;font:inherit;background:#fff;color:var(--ink)}
  .row{display:grid;grid-template-columns:140px 1fr;gap:8px}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chips input{display:none}
  .chips label{margin:0;font-weight:500;border:1px solid var(--line);border-radius:999px;padding:8px 12px;cursor:pointer;font-size:14px}
  .chips input:checked+label{background:var(--accent);border-color:var(--accent);color:#fff}
  .err{color:#c2362f;font-size:13px;min-height:18px;margin-top:8px}
  .fine{color:var(--muted);font-size:12px;margin-top:10px;text-align:center}
  .ty{text-align:center;padding:20px 0}
  .ty .big{font-size:52px}
  .perks{list-style:none;margin:0 0 6px;padding:12px 14px;background:var(--accent-soft);border-radius:14px;display:grid;gap:6px}
  .perks li{padding-left:26px;position:relative;font-weight:600;font-size:14px}
  .perks li::before{content:"🎁";position:absolute;left:0}
  .perks li:first-child::before{content:"🔔"}
  .code{border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:16px 0 6px;background:var(--bg)}
  .code small{display:block;color:var(--muted);font-size:12px;margin-bottom:4px}
  .code .row2{display:flex;align-items:center;justify-content:center;gap:10px}
  .code b.mail{font-size:17px;color:var(--ink);word-break:break-all}
  .code button{border:1px solid var(--accent);background:#fff;color:var(--accent);border-radius:999px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer}
  .note{color:var(--muted);font-size:13px;margin:0 0 6px}
  .ghost{background:transparent;color:var(--accent);box-shadow:none;border:1px solid var(--accent);margin-top:12px}
</style>
</head>
<body>

/* =========================================================
   4) STATE
   ========================================================= */
const qs = new URLSearchParams(location.search);
const store = {
  get(k){try{return localStorage.getItem(k)}catch(e){return null}},
  set(k,v){try{localStorage.setItem(k,v)}catch(e){}}
};
function pickLang(){
  const q=(qs.get("lang")||"").toLowerCase();
  if(UI[q]) return q;
  const n=(navigator.language||"en").toLowerCase();
  if(n.startsWith("zh")) return "zh";
  if(n.startsWith("ja")) return "ja";
  return "en";
}
let lang = pickLang();
const isActive = k => SERVICES[k] && (!CONFIG.ACTIVE || CONFIG.ACTIVE.includes(k));
let svc = isActive(qs.get("s")) ? qs.get("s") : null;
let pv = (qs.get("p")||"").toLowerCase();
if(!CONFIG.PRICE_TEST){ pv="a"; }
else { if(pv!=="a" && pv!=="b"){ pv = store.get("kz_pv") || (Math.random()<.5?"a":"b"); } store.set("kz_pv", pv); }
let sid = store.get("kz_sid"); if(!sid){ sid = Math.random().toString(36).slice(2)+Date.now().toString(36); store.set("kz_sid",sid); }
const UTM = {}; ["utm_source","utm_medium","utm_campaign","utm_content","utm_term","fbclid"].forEach(k=>UTM[k]=qs.get(k)||"");

/* =========================================================
   5) TRACKING (Meta Pixel · GA4 · Google Sheet)
   ========================================================= */
if(CONFIG.META_PIXEL_ID){
  !function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,document,'script','https://connect.facebook.net/en_US/fbevents.js');
  fbq('init', CONFIG.META_PIXEL_ID); fbq('track','PageView');
}
if(CONFIG.GA4_ID){
  const g=document.createElement("script"); g.async=true; g.src="https://www.googletagmanager.com/gtag/js?id="+CONFIG.GA4_ID; document.head.appendChild(g);
  window.dataLayer=window.dataLayer||[]; window.gtag=function(){dataLayer.push(arguments)}; gtag('js',new Date()); gtag('config',CONFIG.GA4_ID);
}
function toSheet(row){
  if(!CONFIG.SHEET_ENDPOINT) return;
  try{
    fetch(CONFIG.SHEET_ENDPOINT,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},
      body:JSON.stringify(Object.assign({event:"",service:svc||"hub",lang:lang,price_variant:pv,session:sid,referrer:document.referrer,ua:navigator.userAgent},UTM,row))}).catch(()=>{});
  }catch(e){}
}
function track(name, extra){
  extra = extra||{};
  const p = Object.assign({service:svc||"hub",lang:lang,price_variant:pv},extra);
  if(window.fbq){
    if(name==="view") fbq('track','ViewContent',{content_name:p.service,content_category:p.lang});
    if(name==="cta")  fbq('track','InitiateCheckout',{content_name:p.service});
    if(name==="lead") fbq('track','Lead',{content_name:p.service});
    fbq('trackCustom','KZ_'+name,p);
  }
  if(window.gtag){
    const map={view:"view_service",cta:"cta_click",lead:"generate_lead",hub_pick:"hub_pick"};
    gtag('event',map[name]||name,p);
  }
  if(name==="lead" || CONFIG.LOG_VIEWS_TO_SHEET) toSheet(Object.assign({event:name},extra));
}

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function renderChrome(){
  document.documentElement.lang = lang==="zh"?"zh-Hant":lang;
  $("brand").innerHTML = esc(CONFIG.BRAND).replace(/-(.*)$/,'-<span>$1</span>');
  $("langs").innerHTML = [["en","EN"],["zh","繁中"],["ja","日本語"]].map(([k,l])=>`<button data-l="${k}" class="${k===lang?"on":""}">${l}</button>`).join("");
  $("foot").textContent = UI[lang].foot;
}
function priceText(s){ return s.t[lang].u.replace("{p}", s.price[pv]); }

function renderService(){
  const s=SERVICES[svc], c=s.t[lang], u=UI[lang];
  document.documentElement.style.setProperty("--accent", s.color);
  document.documentElement.style.setProperty("--accent-soft", s.color+"1f");
  document.title = c.title+" · "+CONFIG.BRAND;
  $("app").innerHTML = `
    <div class="hero">
      <div class="emoji">${s.emoji}</div>
      <span class="badge">${esc(u.badge)}</span>
      <h1>${esc(c.title)}</h1>
      <p class="tag">${esc(c.tag)}</p>
      <div class="price"><small>${esc(u.price)}</small><b>${esc(priceText(s))}</b></div>
      <button class="cta" data-cta="hero">${esc(u.cta)}</button>
    </div>
    <section><h2>${esc(u.what)}</h2><ul class="list">${c.b.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></section>
    <section><h2>${esc(u.how)}</h2><ol class="steps">${c.st.map(x=>`<li>${esc(x)}</li>`).join("")}</ol></section>
    <section style="text-align:center"><button class="cta ghost" id="toHub">${esc(u.back)}</button></section>`;
  $("sticky").hidden=false; $("stickyCta").textContent=u.cta;
  window.scrollTo(0,0);
}

function renderHub(){
  const u=UI[lang];
  document.documentElement.style.setProperty("--accent","#2f6fed");
  document.documentElement.style.setProperty("--accent-soft","#e8efff");
  document.title = CONFIG.BRAND+" · Korea travel, made easy";
  $("app").innerHTML = `
    <div class="hero">
      <span class="badge">${esc(u.badge)}</span>
      <h1>${esc(u.hubTitle)}</h1>
      <p class="tag">${esc(u.hubSub)}</p>
    </div>
    <div class="grid">${Object.keys(SERVICES).filter(isActive).sort((a,b)=>(CONFIG.ACTIVE||[]).indexOf(a)-(CONFIG.ACTIVE||[]).indexOf(b)).map(k=>{const s=SERVICES[k];return `<button class="card" data-s="${k}"><span class="e">${s.emoji}</span><b>${esc(s.t[lang].title)}</b></button>`}).join("")}</div>`;
  $("sticky").hidden=true;
  window.scrollTo(0,0);
}

function render(){ renderChrome(); svc?renderService():renderHub(); }

function setURL(){
  const q=new URLSearchParams(location.search);
  if(svc) q.set("s",svc); else q.delete("s");
  q.set("lang",lang);
  history.replaceState(null,"",location.pathname+"?"+q.toString());
}

function monthOptions(){
  const out=[], d=new Date(); d.setDate(1);
  const loc = lang==="zh"?"zh-TW":lang;
  for(let i=0;i<12;i++){
    const m=new Date(d.getFullYear(), d.getMonth()+i, 1);
    const v=m.getFullYear()+"-"+String(m.getMonth()+1).padStart(2,"0");
    let label=v; try{ label=new Intl.DateTimeFormat(loc,{year:"numeric",month:"long"}).format(m);}catch(e){}
    out.push(`<option value="${v}">${esc(label)}</option>`);
  }
  out.push(`<option value="undecided">${esc(UI[lang].notDecided)}</option>`);
  return out.join("");
}

  let dn=null; try{ dn=new Intl.DisplayNames([lang==="zh"?"zh-Hant":lang],{type:"region"}); }catch(e){}
  return `<option value=""></option>`+COUNTRIES.map(c=>{
    const label = c==="OTHER" ? UI[lang].other : (dn? dn.of(c) : c);
    return `<option value="${c}">${esc(label)}</option>`;}).join("");
}
function chips(name, opts){
  return `<div class="chips">${opts.map((o,i)=>`<input type="radio" name="${name}" id="${name}${i}" value="${esc(o)}"><label for="${name}${i}">${esc(o)}</label>`).join("")}</div>`;
}
function openSheet(where){
  track("cta",{where:where});
  const s=SERVICES[svc], c=s.t[lang], u=UI[lang];
  $("sheetIn").innerHTML = `
    <h3>${esc(u.mTitle)}</h3>
    <p style="margin-bottom:8px">${esc(u.mBody)}</p>
    <ul class="perks">${u.perks.map(x=>`<li>${esc(x.replace("{d}",CONFIG.DISCOUNT))}</li>`).join("")}</ul>
    <form id="f" novalidate>
      <label>${esc(c.q)}</label>${chips("ans",c.o)}
      <label>${esc(u.wtp)} <span style="font-weight:500;color:var(--muted)">(${esc(priceText(s))})</span></label>${chips("wtp",u.wtpO)}
      <label for="em">${esc(u.email)} *</label><input id="em" type="email" inputmode="email" autocomplete="email" placeholder="you@example.com">
      <label for="co">${esc(u.nat)} *</label><select id="co">${countryOptions()}</select>
      <label for="nm">${esc(u.name)}</label><input id="nm" autocomplete="name">
      <label>${esc(u.msg)}</label>
      <div class="row"><select id="ct">${MESSENGERS.map(x=>`<option>${x}</option>`).join("")}</select><input id="cv" placeholder="${esc(u.msgPh)}"></div>
      <label for="mo">${esc(u.when)}</label><select id="mo">${monthOptions()}</select>
      <div class="err" id="err"></div>
      <button class="cta" type="submit">${esc(u.submit)}</button>
      <div class="fine">${esc(u.privacy)}</div>
    </form>`;
  $("shade").style.display="block"; $("sheet").style.display="block";
  $("f").addEventListener("submit", submitForm);
}
function closeSheet(){ $("shade").style.display="none"; $("sheet").style.display="none"; }
function submitForm(e){
  e.preventDefault();
  const u=UI[lang];
  const email=$("em").value.trim();
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){ $("err").textContent=u.reqEmail; $("em").focus(); return; }
  if(!$("co").value){ $("err").textContent=u.reqNat; $("co").focus(); return; }
  const msgId=$("cv").value.trim();
  const val = n => { const x=document.querySelector(`input[name="${n}"]:checked`); return x?x.value:""; };
  track("lead",{email:email,nationality:$("co").value,name:$("nm").value.trim(),messenger_type:msgId?$("ct").value:"",messenger_id:msgId,visit_month:$("mo").value,service_answer:val("ans"),wtp:val("wtp")});
  $("sheetIn").innerHTML = `<div class="ty"><div class="big">🎉</div><h3>${esc(u.tyTitle)}</h3>
    <p style="margin:0">${esc(u.tyBody.replace("{d}",CONFIG.DISCOUNT))}</p>
    <div class="code"><small>✉️ ${esc(u.tyNote.replace("{email}",""))}</small><b class="mail">${esc(email)}</b></div>
    <button class="cta ghost" id="tyHub">${esc(u.back)}</button></div>`;
}

/* ---------- events ---------- */
document.addEventListener("click", e=>{
  const t=e.target.closest("[data-l],[data-s],[data-cta],#stickyCta,#toHub,#tyHub,#close,#shade,#brand");
  if(!t) return;
  if(t.dataset.l){ lang=t.dataset.l; setURL(); render(); return; }
  if(t.dataset.s){ svc=t.dataset.s; track("hub_pick",{picked:svc}); setURL(); render(); track("view"); return; }
  if(t.dataset.cta) return openSheet(t.dataset.cta);
  if(t.id==="stickyCta") return openSheet("sticky");
  if(t.id==="toHub"||t.id==="tyHub"||t.id==="brand"){ closeSheet(); svc=null; setURL(); render(); track("view"); return; }
  if(t.id==="close"||t.id==="shade") return closeSheet();
});

render();
track("view");
</script>
</body>
</html>
